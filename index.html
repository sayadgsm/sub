<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>افزودن اشتراک به KavoshNET</title>
    <script>
        function getSubscriptionId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id') || '';
        }

        window.onload = function() {
            const id = getSubscriptionId();
            
            if (id) {
                const link = 'kavoshnet://subscribe?id=' + encodeURIComponent(id);
                document.getElementById('sub-id').innerText = '🆔 شناسه: ' + id;
                document.getElementById('sub-id').style.display = 'inline-block';
                document.getElementById('btn-add').href = link;
                document.getElementById('btn-add').style.display = 'inline-block';
                document.getElementById('app-name').style.display = 'inline-block';
                
                // ریدایرکت خودکار بعد از 1.5 ثانیه
                setTimeout(function() {
                    window.location.href = link;
                }, 1500);
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            direction: rtl;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 45px 35px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        .icon { font-size: 60px; margin-bottom: 10px; }
        h1 { 
            color: #1a1a2e; 
            font-size: 24px; 
            margin-bottom: 8px;
            font-weight: 900;
        }
        .sub-title { color: #888; font-size: 14px; margin-bottom: 25px; }
        #sub-id {
            background: #f0f4ff;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 16px;
            color: #333;
            margin: 15px 0 25px 0;
            border: 2px dashed #667eea;
            font-weight: bold;
            display: none;
        }
        .btn {
            display: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white !important;
            padding: 16px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            transition: all 0.3s;
            width: 100%;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }
        .btn:active { transform: scale(0.97); }
        .error-msg {
            display: none;
            background: #fff0f0;
            color: #d32f2f;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #ffcdd2;
        }
        .footer { margin-top: 20px; font-size: 12px; color: #aaa; }
        #app-name {
            display: none;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🚀</div>
        <h1>افزودن اشتراک به KavoshNET</h1>
        <p class="sub-title">با کلیک روی دکمه زیر، اشتراک شما به‌صورت خودکار اضافه می‌شود</p>

        <div id="error-msg" class="error-msg">
            ❌ شناسه اشتراک یافت نشد
        </div>

        <div id="sub-id"></div>

        <a id="btn-add" href="#" class="btn">
            ➕ افزودن اشتراک
        </a>

        <div id="app-name">🔒 فقط با KavoshNET باز می‌شود</div>
        <div class="footer">پس از کلیک، برنامه KavoshNET باز خواهد شد</div>
    </div>

</body>
</html>
